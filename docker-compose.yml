services:

  # ─── MongoDB with single-node replica set ────────────────────────────────
  # Why replica set for a single-service compose:
  # The Outbox pattern (NFR-REL-005) requires MongoDB transactions.
  # Transactions require a replica set — they are not available on standalone
  # MongoDB instances. A single-node rs0 replica set is functionally identical
  # to standalone for reads/writes but unlocks the multi-document transaction API.
  mongodb:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - venue-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot container that initialises the rs0 replica set after MongoDB is healthy.
  # Uses restart: on-failure so it retries if MongoDB isn't fully ready yet.
  mongo-rs-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: on-failure
    entrypoint: >
      mongosh --host mongodb:27017 --quiet --eval
      "try { rs.status(); print('already initialised'); }
       catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }); print('initialised'); }"

  # ─── Kafka (KRaft mode — no Zookeeper) ───────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # REPLACE WITH:
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      kafka:
        condition: service_healthy
    # List form guarantees Docker splits command correctly.
    # entrypoint: string form with > folds into one token — Docker treats the
    # entire folded string as the executable name, causing exit 127.
    command:
      - bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic venue.events \
          --partitions 6 \
          --replication-factor 1 &&
        kafka-topics --bootstrap-server kafka:9092 \
          --create --if-not-exists \
          --topic venue.events.dlq \
          --partitions 6 \
          --replication-factor 1 &&
        echo 'Topics created.'

  # ─── Venue Service ────────────────────────────────────────────────────────
  venue-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      NODE_ENV: development
      # RULE-16: inside Docker, use the internal listener name — not localhost.
      KAFKA_BROKERS: kafka:9092
      # directConnection=true: required for single-node replica set.
      # Without it, the Mongoose driver tries to discover all replica set members
      # and may time out if the hostname 'mongodb' doesn't resolve to all members.
      MONGODB_URI: mongodb://mongodb:27017/venue?replicaSet=rs0&directConnection=true
      AUTH_JWKS_URI: http://host.docker.internal:8081/auth/jwks
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SERVICE_NAME: venue-service
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-rs-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  venue-mongo-data:
